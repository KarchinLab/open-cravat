name: Build PyPI
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (default: tag name, or short commit hash)"
        type: string
        required: false
  # Temporary trigger for testing on the branch; remove before merging
  # push:
  #   branches:
  #     - 'ci/split-builds'

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Set version
        shell: bash
        env:
          # Tag name on tags, otherwise the short commit hash
          INPUT_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: echo "VERSION=${INPUT_VERSION:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup build environment
        run: python -m pip install build
      - name: Build gztar
        run: python -m build --sdist --outdir dist
      - name: Archive sdist
        uses: actions/upload-artifact@v4
        with:
          name: open_cravat-${{ env.VERSION }}.tar.gz
          path: ./dist/**
